<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Dự Án</title>
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- FORM-ADD -->
    <div class="add-form" id="add-form">
        <div class="popup-container">
            <div class="popup-header">
                <h2 class="popup-title">Thêm/sửa dự án</h2>
                <button class="popup-close" id="popup-close">&times;</button>
            </div>
            <form class="popup-form">
                <div class="form-group">
                    <label class="form-label">Tên dự án</label>
                    <input type="text" class="form-input" id="form-input">
                    <small id="name-error" style="color: red;"></small>
                </div>

                <div class="form-group">
                    <label class="form-label">Mô tả dự án</label>
                    <textarea class="form-textarea" id="form-textarea"></textarea>
                    <small id="desc-error" style="color: red;"></small>
                </div>
            </form>
            <div class="popup-buttons">
                <button type="button" class="btn btn-cancel" id="btn-cancel">Hủy</button>
                <button type="submit" class="btn btn-submit" id="btn-submit">Lưu</button>
            </div>
        </div>
    </div>
    <!-- FORM-ADD -->
    <nav class="top-nav">
        <div class="nav-left">
            <a href="home.html" class="nav-link">Quản Lý Dự Án</a>
        </div>
        <div class="nav-right">
            <a href="jobs.html" class="nav-link">Dự Án</a>
            <a href="" class="nav-link">Nhiệm Vụ của tôi</a>
            <a href="#" id="logout" class="nav-link">Đăng Xuất</a>
        </div>
    </nav>

    <main class="container">
        <div class="header">
            <h2>Quản Lý Dự Án Nhóm</h2>
        </div>

        <div class="search-box">
            <button class="btn-add" id="btn-add"><i class="fas fa-plus"></i> Thêm Dự Án</button>
            <input type="text" placeholder="Tìm kiếm dự án" id="search-input">
        </div>
        <div class="listProject">
            <h3>Danh sách dự án</h3>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th class="mid">Tên Dự Án</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dữ liệu được render từ JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <div class="pagination">
        <button id="prev">‹</button>
        <div id="btnPage"></div>
        <button id="next">›</button>
    </div>

    <footer class="footer">
        © 2025 Quản Lý Dự Án Nhóm. All rights reserved.
    </footer>
</body>
<script src="../js/home.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</html>
